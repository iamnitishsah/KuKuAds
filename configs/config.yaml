# KuKuAds configuration.
# Swap models here, or override from the CLI:  python run.py ... --provider anthropic --model <model-id>

providers:
  freellm:        # local router app (OpenAI-compatible)
    type: openai_compatible
    base_url: http://127.0.0.1:31415/v1
    api_key_env: FREELLM_API_KEY
  openai:
    type: openai_compatible
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
  gemini:         # Gemini's OpenAI-compatible endpoint
    type: openai_compatible
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
  groq:
    type: openai_compatible
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
  anthropic:
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY
  ollama:         # self-hosted Ollama (e.g. Colab GPU behind a tunnel); set OLLAMA_BASE_URL in .env
    type: openai_compatible
    base_url_env: OLLAMA_BASE_URL
    api_key_env: OLLAMA_API_KEY   # Ollama ignores it, but the client needs a value: use "ollama"
    extra_body: {reasoning_effort: none}   # thinking models (qwen3.x): ~90s -> ~5s per call

# Each stage uses a PINNED model. Later entries are used only if the first one fails
# (after retries). Every call logs which model actually answered.
# The judge deliberately uses a different model than the finder, so it does not grade its own picks.
stages:
  finder:
    - {provider: freellm, model: gpt-oss-120b}
    - {provider: freellm, model: command-a}
  # ONE judge model for every clip, never the finder model, and no fallback: mixing judge models
  # made scores incomparable (see report history). If it is unavailable, the run stops judging
  # and can be resumed; finished judgements are cached.
  # No Ollama? Swap it from the CLI:  --judge-provider freellm --judge-model command-a
  judge:
    - {provider: ollama, model: "qwen3.8:27b"}

judge_repeats: 2        # judge each clip this many times and average (also measures judge consistency)

llm:
  max_tokens: 4000      # reasoning models spend ~1k tokens thinking before answering
  temperature: 0.2
  timeout_s: 120
  max_retries: 2        # SDK-level retries on 429/5xx, per model
  rate_limit_max_wait_s: 180   # on a rate limit, wait up to this long for the reset and keep the pinned model
  rate_limit_retries: 4        # ...at most this many times per call, then use the fallback

promo:
  min_s: 20
  max_s: 60
  hook_window_s: 3      # the hook beat must start within this many seconds of the clip start
  promos_per_episode: 3 # upper bound the finder may return

ranking:
  weights: {hook: 0.30, cliffhanger: 0.30, clarity: 0.30, intensity: 0.10}
  entry_point_bonus: 0.05      # added for promos from the first N episodes (viewers land on Ep 1)
  entry_point_episodes: 5
  max_per_episode_in_top: 1    # diversity: at most this many promos per episode in the top list
  top_n: 15
