[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promofinder"
version = "1.0.0"
description = "Find the best 20-60 s promos in microdrama screenplays"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40", "anthropic>=0.40", "fastapi>=0.110", "uvicorn>=0.29",
  "python-multipart>=0.0.9", "pyyaml>=6.0", "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"promofinder.api" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
