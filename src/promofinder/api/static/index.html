<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promo Finder</title>
<style>
  :root {
    --bg: #f7f6f3; --surface: #ffffff; --text: #1d1d1b; --muted: #6b6a66; --border: #e3e1db;
    --accent: #c2410c; --accent-soft: #fff1e8; --good: #15803d; --mid: #a16207; --bad: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --surface: #1f1f1d; --text: #ecebe7; --muted: #9c9b96; --border: #34332f;
            --accent: #fb923c; --accent-soft: #2a1d14; --good: #4ade80; --mid: #facc15; --bad: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input, select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
                  background: var(--bg); color: var(--text); font: inherit; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  button { margin-top: 14px; padding: 9px 16px; border: 0; border-radius: 6px; background: var(--accent);
           color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #log { margin-top: 12px; max-height: 160px; overflow: auto; font: 12px/1.45 ui-monospace, Consolas, monospace;
         color: var(--muted); white-space: pre-wrap; }
  .bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 10px; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 10px; }
  .toolbar a { color: var(--accent); font-size: 13px; }
  .tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  tr.held td { opacity: .55; }
  .segs { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .score { display: inline-block; min-width: 22px; text-align: center; border-radius: 4px; padding: 0 4px;
           font-weight: 600; font-variant-numeric: tabular-nums; }
  .s5, .s4 { color: var(--good); } .s3 { color: var(--mid); } .s2, .s1 { color: var(--bad); }
  .why { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .pill { font-size: 11px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 1px 8px; }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>Promo Finder</h1>
  <p class="sub">Finds 20–60s promos in microdrama screenplays: a hook in the first 3 seconds, a cliffhanger ending, clear to a stranger.</p>

  <div class="grid">
    <form class="card" id="runForm">
      <h2>New run</h2>
      <label for="files">Screenplays (.txt, one per episode)</label>
      <input type="file" id="files" name="files" accept=".txt" multiple>
      <label for="scripts_dir">…or a folder on this machine</label>
      <input id="scripts_dir" name="scripts_dir" placeholder="C:\path\to\show">
      <label for="episodes">Episodes (optional)</label>
      <input id="episodes" name="episodes" placeholder="e.g. 1-5,12">
      <div class="row">
        <div><label for="provider">Provider override</label><select id="provider" name="provider"><option value="">config.yaml</option></select></div>
        <div><label for="model">Model</label><input id="model" name="model" placeholder="model id"></div>
      </div>
      <button type="submit" id="go">Find promos</button>
      <div class="bar"><div id="barFill"></div></div>
      <div id="log"></div>
    </form>

    <div class="card">
      <h2>Models in use</h2>
      <div id="models" class="why">Loading…</div>
      <label for="runs">Open a previous run</label>
      <select id="runs"></select>
    </div>
  </div>

  <div class="toolbar">
    <strong id="runTitle">No run selected</strong>
    <label style="margin:0"><input type="checkbox" id="topOnly" checked style="width:auto"> Top list only</label>
    <span id="links"></span>
  </div>
  <div class="tablewrap">
    <table>
      <thead><tr><th>#</th><th>Promo</th><th>Segments</th><th>Len</th><th>Hook → Cliffhanger</th>
        <th title="Cold-viewer judge: hook / cliffhanger / clarity">H / C / Cl</th><th>Score</th></tr></thead>
      <tbody id="rows"><tr><td colspan="7" class="empty">Run the pipeline or open a previous run.</td></tr></tbody>
    </table>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ts = (s) => { const m = Math.floor(s / 60); return `${String(m).padStart(2,"0")}:${(s - m*60).toFixed(2).padStart(5,"0")}`; };
const sc = (v) => `<span class="score s${v ?? 0}">${v ?? "–"}</span>`;
let current = null;

async function loadConfig() {
  const c = await (await fetch("/api/config")).json();
  $("models").innerHTML = Object.entries(c.stages).map(([stage, chain]) =>
    `<div><b>${esc(stage)}</b>: ${chain.map((m, i) => `${esc(m.model)}${i ? " (fallback)" : ""}`).join(" → ")}</div>`).join("");
  for (const p of Object.keys(c.providers)) $("provider").insertAdjacentHTML("beforeend", `<option>${esc(p)}</option>`);
}

async function loadRuns(select) {
  const runs = await (await fetch("/api/runs")).json();
  $("runs").innerHTML = `<option value="">—</option>` + runs.map((r) =>
    `<option value="${esc(r.run)}">${esc(r.run)} · ${r.episodes} eps · ${esc(r.finder)}</option>`).join("");
  if (select) { $("runs").value = select; showRun(select); }
}

async function showRun(run) {
  if (!run) return;
  current = run;
  const rows = await (await fetch(`/api/runs/${run}/promos?top_only=${$("topOnly").checked}`)).json();
  $("runTitle").textContent = `${run} — ${rows.length} promos`;
  $("links").innerHTML = ["report.md", "promos_ranked.csv", "candidates.json", "baseline.json"]
    .map((f) => `<a href="/api/runs/${run}/files/${f}" target="_blank">${f}</a>`).join(" · ");
  $("rows").innerHTML = rows.length ? rows.map((r) => {
    const j = r.judge || {};
    const segs = r.segments.map((s) => `Ep ${s.episode} ${ts(s.start)}–${ts(s.end)}`).join("<br>");
    return `<tr class="${r.in_top_list ? "" : "held"}">
      <td>${r.rank}</td>
      <td>${esc(r.promo_id)}${r.segments.length > 1 ? ' <span class="pill">stitched</span>' : ""}</td>
      <td class="segs">${segs}</td>
      <td>${Math.round(r.duration_s)}s</td>
      <td><b>${esc(r.hook)}</b><br>→ ${esc(r.cliffhanger)}<div class="why">${esc(r.why)}</div>
          ${j.confusing && j.confusing.toLowerCase() !== "nothing" ? `<div class="why">Judge unsure: ${esc(j.confusing)}</div>` : ""}</td>
      <td class="segs">${sc(j.hook)} ${sc(j.cliffhanger)} ${sc(j.clarity)}</td>
      <td>${(r.scores && r.scores.final != null) ? r.scores.final.toFixed(2) : "–"}</td></tr>`;
  }).join("") : `<tr><td colspan="7" class="empty">No valid promos in this run.</td></tr>`;
}

$("runs").addEventListener("change", (e) => showRun(e.target.value));
$("topOnly").addEventListener("change", () => current && showRun(current));

$("runForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData();
  for (const f of $("files").files) fd.append("files", f);
  for (const k of ["scripts_dir", "episodes", "provider", "model"]) if ($(k).value) fd.append(k, $(k).value);
  $("go").disabled = true; $("log").textContent = "Starting…";
  const res = await fetch("/api/jobs", { method: "POST", body: fd });
  const job = await res.json();
  if (!res.ok) { $("log").textContent = job.detail || "Failed"; $("go").disabled = false; return; }
  const poll = setInterval(async () => {
    const s = await (await fetch(`/api/jobs/${job.run}`)).json();
    $("log").textContent = s.log.slice(-12).join("\n");
    $("barFill").style.width = s.total ? `${Math.round(100 * s.done / s.total)}%` : "5%";
    if (s.status !== "running") {
      clearInterval(poll); $("go").disabled = false;
      if (s.status === "done") loadRuns(job.run); else $("log").textContent += `\n${s.error || "failed"}`;
    }
  }, 1500);
});

loadConfig(); loadRuns();
</script>
</body>
</html>
